name: Build better-sqlite3 Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: 22.17.0
  PYTHON_VERSION: "3.11"

jobs:
  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs_on: macos-14
          - target: darwin-x64
            runs_on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Show toolchain
        run: |
          node --version
          npm --version
          python3 --version
          xcode-select -p
      - name: Build target
        run: node scripts/build-target.mjs ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/better_sqlite3.node
            dist/manifest.json

  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Show toolchain
        run: |
          uname -a
          node --version
          npm --version
          docker --version
      - name: Build target
        run: node scripts/build-linux-docker.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            dist/linux-x64/better_sqlite3.node
            dist/manifest.json

  build-windows:
    name: Build ${{ matrix.target }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-ia32
          - win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure MSVC for node-gyp
        shell: pwsh
        run: |
          echo "npm_package_config_node_gyp_msvs_version=2022" >> $env:GITHUB_ENV
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
      - name: Build target
        run: node scripts/build-target.mjs ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/better_sqlite3.node
            dist/manifest.json
